<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>JsAPI Executor Background</title>
    <!-- 只加载必要的插件脚本 -->
    <script type="text/javascript" src="plugins.js"></script>
    <!-- WebSocket 客户端 - 用于接收外部命令 -->
    <script type="text/javascript" src="ws-client.js"></script>
    <style>
        /* 隐藏所有内容，插件在后台运行 */
        html,
        body {
            display: none;
            margin: 0;
            padding: 0;
            width: 0;
            height: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- 后台插件，无 UI -->
    <script>
        (function (window, undefined) {
            window.Asc.plugin.init = function () {

                console.log("window.Asc.plugin.init");

                const info = window.Asc.plugin.info;
                console.log('[Plugin] info (含 plugins.options):', info);

                window.parent.document.getElementById("left-btn-navigation").click();

                // 等 options 注入到 info 后再连 WebSocket
                if (window.WSClient && typeof window.WSClient.connect === 'function') {
                    console.log('[Plugin] 启动 WebSocket，配置:', window.WSClient.getPluginConfig());
                    window.WSClient.connect();
                } else {
                    console.error('[Plugin] WSClient 未就绪，无法连接 WebSocket');
                }

                // // 打开批注
                // window.Asc.plugin.executeMethod("OpenComments", []);

                // //隐藏插件菜单
                // window.Asc.plugin.executeMethod("HidePluginMenu", []);

                // //隐藏菜单栏
                // window.Asc.plugin.executeMethod("HideMenuBar", []);

                // //隐藏工具栏
                // window.Asc.plugin.executeMethod("HideToolBar", []);

                // //隐藏状态栏
                // window.Asc.plugin.executeMethod("HideStatusBar", []);

                // //隐藏工具栏按钮
                // window.Asc.plugin.executeMethod("HideToolBarButton", []);

                // //隐藏状态栏按钮
                // window.Asc.plugin.executeMethod("HideStatusBarButton", []);

                // //隐藏菜单栏按钮
                // window.Asc.plugin.executeMethod("HideMenuBarButton", []);
            }
        })(window, undefined);

        // 确保插件环境就绪
        if (window.Asc && window.Asc.plugin) {
            console.log('[JsAPI Executor] 后台插件已启动，等待 Asc.plugin.init...');
        } else {
            setTimeout(function () {
                if (window.Asc && window.Asc.plugin) {
                    console.log('[JsAPI Executor] 后台插件已启动，等待 Asc.plugin.init...');
                }
            }, 100);
        }
    </script>
</body>

</html>
